name: weekly-data-refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Refresh kiranico data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/bootstrap_data.py

      - name: Open PR if data changed
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          BRANCH="data/refresh-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "data: refresh kiranico $(date +%F)"
          git push origin "$BRANCH"
          gh pr create \
            --title "data: refresh $(date +%F)" \
            --body "Automated weekly data refresh from kiranico.com." \
            --head "$BRANCH" \
            --base main \
            --draft